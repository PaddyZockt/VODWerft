# Baut bei jedem Versions-Tag (v0.1.0, v0.1.0-beta.1, ...) das Upload-Server-Image und legt es in die GitHub Container Registry.
name: Image bauen
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag und Datei VERSION muessen zusammenpassen
        run: |
          test "v$(tr -d '[:space:]' < server/VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu server/VERSION"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vodwerft-uploader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Vorabversionen (Betas) bekommen kein major.minor; die Compose-Datei nutzt "latest", damit sie immer ein Image findet
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
