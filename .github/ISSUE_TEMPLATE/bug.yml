name: "Bug report / Fehler melden"
description: "Something does not work as expected / Etwas funktioniert nicht wie erwartet"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing VODWerft! / Danke fürs Testen von VODWerft!

        **Please do not post passwords, tokens, API keys or personal file paths. Issues are public.**
        **Bitte keine Passwörter, Tokens, API-Schlüssel oder persönliche Dateipfade posten. Issues sind öffentlich.**
  - type: input
    id: version
    attributes:
      label: "VODWerft version / Version"
      description: "Shown in the window title and in the installer, e.g. 0.1.0-beta.6 / Steht in der Titelleiste und im Installer."
      placeholder: "0.1.0-beta.6"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "Windows version and graphics card / Windows-Version und Grafikkarte"
      placeholder: "Windows 11 23H2, NVIDIA RTX 3060"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened? / Was ist passiert?"
      description: "What did you expect, what happened instead? / Was hast du erwartet, was ist stattdessen passiert?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / So lässt es sich nachstellen"
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: textarea
    id: report
    attributes:
      label: "Error report or log / Fehlerbericht oder Log"
      description: |
        In the app: **Help → Create error report** (Hilfe → Fehlerbericht erstellen). Passwords and tokens are removed, but please look through the text before you paste it.
        Bei Installationsproblemen hilft die Datei `%TEMP%\vodwerft-setup.log`.
      render: text
